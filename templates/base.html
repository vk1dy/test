<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: rgba(255, 254, 254, 0.07);
      --text: #e8e4de;
      --muted: rgba(165, 163, 161, 0.527);
      --accent: #ffffff;
      --accent2: #fffffffe;
      --radius: 2px;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 3rem;
      background: linear-gradient(to bottom, rgba(14,14,14,0.95), transparent);
      backdrop-filter: blur(4px);
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); font-style: italic; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--text); }

    /* ── Main ── */
    main { padding-top: 5rem; min-height: 100vh; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-top: 1px solid var(--border);
      margin-top: 6rem;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.96);
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 92vw; max-height: 88vh;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    #lightbox-caption {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }
    #lightbox-close {
      position: absolute; top: 1.5rem; right: 2rem;
      background: none; border: none; color: var(--muted);
      font-size: 2rem; cursor: pointer; line-height: 1;
      transition: color 0.2s;
    }
    #lightbox-close:hover { color: var(--text); }
    #lightbox-prev, #lightbox-next {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      font-size: 2rem; cursor: pointer; padding: 1rem;
      transition: color 0.2s;
    }
    #lightbox-prev:hover, #lightbox-next:hover { color: var(--text); }
    #lightbox-prev { left: 1rem; }
    #lightbox-next { right: 1rem; }
    #lightbox-loader {
      position: absolute;
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #lightbox-counter {
      position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      color: var(--muted); font-size: 0.7rem; letter-spacing: 0.1em;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <a class="nav-logo" href="/">{{ site_title }}<span>.</span></a>
  <div class="nav-links">
    {% if site_author %}<a href="/">Портфолио</a>{% endif %}
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  {% if site_author %}{{ site_author }} &nbsp;·&nbsp; {% endif %}
  {{ site_title }}
</footer>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true">
  <button id="lightbox-close" aria-label="Закрыть">×</button>
  <div id="lightbox-loader"></div>
  <img id="lightbox-img" src="" alt="" />
  <p id="lightbox-caption"></p>
  <button id="lightbox-prev" aria-label="Предыдущее">‹</button>
  <button id="lightbox-next" aria-label="Следующее">›</button>
  <div id="lightbox-counter"></div>
</div>

<script>
// ── Lightbox logic ──────────────────────────────────────────────────────────
const lb = {
  el: document.getElementById('lightbox'),
  img: document.getElementById('lightbox-img'),
  caption: document.getElementById('lightbox-caption'),
  loader: document.getElementById('lightbox-loader'),
  counter: document.getElementById('lightbox-counter'),
  images: [],
  idx: 0,

  open(images, idx) {
    this.images = images;
    this.idx = idx;
    this.el.classList.add('open');
    document.body.style.overflow = 'hidden';
    this.show();
  },
  close() {
    this.el.classList.remove('open');
    document.body.style.overflow = '';
    this.img.src = '';
  },
  show() {
    const item = this.images[this.idx];
    this.loader.style.display = 'block';
    this.img.style.opacity = '0';
    this.counter.textContent = `${this.idx + 1} / ${this.images.length}`;
    this.caption.textContent = item.name || '';
    const url = `/proxy/full?path=${encodeURIComponent(item.path)}`;
    const tmp = new Image();
    tmp.onload = () => {
      this.img.src = url;
      this.img.style.opacity = '1';
      this.loader.style.display = 'none';
    };
    tmp.src = url;
  },
  prev() { this.idx = (this.idx - 1 + this.images.length) % this.images.length; this.show(); },
  next() { this.idx = (this.idx + 1) % this.images.length; this.show(); },
};

document.getElementById('lightbox-close').onclick = () => lb.close();
document.getElementById('lightbox-prev').onclick  = () => lb.prev();
document.getElementById('lightbox-next').onclick  = () => lb.next();
document.getElementById('lightbox').onclick = e => { if (e.target === lb.el) lb.close(); };

document.addEventListener('keydown', e => {
  if (!lb.el.classList.contains('open')) return;
  if (e.key === 'Escape')      lb.close();
  if (e.key === 'ArrowLeft')   lb.prev();
  if (e.key === 'ArrowRight')  lb.next();
});

// touch swipe
let touchX = 0;
lb.el.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
lb.el.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) dx < 0 ? lb.next() : lb.prev();
});

window.openLightbox = (images, idx) => lb.open(images, idx);
</script>

{% block scripts %}{% endblock %}
</body>
</html>
